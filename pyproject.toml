[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffswak"
version = "0.1.0"
description = "A Python wrapper for common ffmpeg video editing tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "ffmpeg-python>=0.2,<0.3",
    "humanize>=4,<5",
    "psutil>=7,<8",
    "rich>=14,<15",
]

[project.scripts]
ffswak = "ffswak:main"

[tool.setuptools]
py-modules = ["ffswak"]

[dependency-groups]
test = [
    "numpy>=2,<3",
    "pytest>=8,<9",
    "pytest-xdist>=3.8,<4",
]
lint = ["ruff>=0.16,<0.17"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F821", "PLW0602"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n 4"
markers = [
    "integration: generates, processes, and decodes real videos (requires ffmpeg and ffprobe)",
]
