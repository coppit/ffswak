name: Package

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install FFmpeg with stabilization support
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install test and lint dependencies
        run: uv sync --locked --group test --group lint
      - name: Check source code
        run: uv run --no-sync ruff check .
      - name: Run tests
        run: uv run --no-sync pytest
      - run: uv build --no-sources
      - name: Install the built wheel in a clean environment
        run: |
          uv venv /tmp/ffswak-smoke --python 3.11
          uv pip install --python /tmp/ffswak-smoke/bin/python dist/*.whl
          /tmp/ffswak-smoke/bin/ffswak --help
